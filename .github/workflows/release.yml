name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl-tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Resolve name
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${GITHUB_SHA::7}"
          fi
          echo "NAME=plurk-${tag}-${{ matrix.target }}" >> "$GITHUB_ENV"
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir "$NAME"
          bin="target/${{ matrix.target }}/release/plurk"
          cp "$bin" README.md LICENSE "$NAME/"
          tar czf "$NAME.tar.gz" "$NAME"
          shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory $env:NAME | Out-Null
          $bin = "target/${{ matrix.target }}/release/plurk.exe"
          Copy-Item $bin, README.md, LICENSE $env:NAME
          Compress-Archive -Path $env:NAME -DestinationPath "$env:NAME.zip"
          $h = (Get-FileHash "$env:NAME.zip" -Algorithm SHA256).Hash.ToLower()
          "$h  $env:NAME.zip" | Out-File -Encoding ascii "$env:NAME.zip.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: |
            ${{ env.NAME }}.tar.gz
            ${{ env.NAME }}.zip
            ${{ env.NAME }}.*.sha256
          if-no-files-found: error

  release:
    name: publish release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" --generate-notes --verify-tag
          fi
